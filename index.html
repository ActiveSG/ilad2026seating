<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ILAD 2026 — Seating Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161a;
    --ink-soft: #2a2d33;
    --paper: #eeece6;
    --paper-dim: #e2ded4;
    --brass: #a98a4e;
    --brass-bright: #c9a961;
    --line: rgba(20,22,26,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--ink);
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding: 44px 36px;
    background: rgba(10,8,8,0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(201,169,97,0.25);
    border-radius: 3px;
  }

  .title-img {
    max-width: 100%;
    height: auto;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--brass-bright);
    margin-bottom: 14px;
    font-weight: 600;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  .sub {
    font-size: 14px;
    color: rgba(238,236,230,0.55);
    margin-bottom: 36px;
  }

  .search-row {
    position: relative;
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    padding: 16px 20px;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    background: rgba(238,236,230,0.06);
    border: 1px solid rgba(238,236,230,0.18);
    border-radius: 2px;
    color: var(--paper);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input[type="text"]::placeholder {
    color: rgba(238,236,230,0.35);
  }

  input[type="text"]:focus {
    border-color: var(--brass-bright);
    background: rgba(238,236,230,0.09);
  }

  input[type="text"]:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  button#findBtn {
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 28px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    background: var(--brass-bright);
    color: var(--ink);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.05s ease;
  }

  button#findBtn:hover {
    background: #dab975;
  }

  button#findBtn:active {
    transform: translateY(1px);
  }

  button#findBtn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }

  #result {
    min-height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-inner {
    animation: rise 0.35s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-name {
    font-size: 13px;
    color: rgba(238,236,230,0.5);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .result-table {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    line-height: 1;
    color: var(--brass-bright);
    font-weight: 600;
  }

  .result-label {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(238,236,230,0.45);
    margin-top: 6px;
  }

  .hint, .empty, .multi {
    color: rgba(238,236,230,0.4);
    font-size: 14px;
  }

  .multi-list {
    text-align: left;
    display: inline-block;
  }

  .multi-item {
    padding: 10px 16px;
    border: 1px solid rgba(238,236,230,0.15);
    border-radius: 2px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    font-size: 14px;
  }

  .multi-item:hover, .multi-item:focus-visible {
    border-color: var(--brass-bright);
    background: rgba(238,236,230,0.06);
  }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: rgba(238,236,230,0.28);
    letter-spacing: 0.04em;
  }

  @media (max-width: 480px) {
    h1 { font-size: 32px; }
    .result-table { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="card">
  <img src="title.png" alt="International Lifeguard Appreciation Day — Dinner and Awards 2026" class="title-img">
  <div class="sub"> · HomeTeamNS Khatib · 30 July 2026</div>

  <form id="searchForm" autocomplete="off">
    <div class="search-row"><div class="hint" style="margin-bottom: 14px;">Enter your full name and press Find my Table</div>

  <form id="searchForm" autocomplete="off">
    <div class="search-row">
      <input
        type="text"
        id="searchInput"
        placeholder="Type your full name"
        autocomplete="off"
        autocapitalize="words"
      >
    </div>
    <button type="submit" id="findBtn">Find my table</button>
  </form>

  <div id="result"></div>
</div>
    <div id="result">
    <div class="hint">Enter your full name and press Find</div>
  </div>

  <footer>Sample data · replace with actual guest list before deploying</footer>
</div>

<script>
  // ---- Sample data. Replace with actual guest list. ----
  // Each entry: { name: "Full Name", table: "Table number/label" }
  const GUESTS = [
    { name: "Tan Wei Ming", table: "12" },
    { name: "Nur Aisyah Binte Rahman", table: "4" },
    { name: "Rajesh Kumar", table: "7" },
    { name: "Lim Hui Ying", table: "12" },
    { name: "Muhammad Faiz", table: "9" },
    { name: "Chua Bee Choo", table: "3" },
    { name: "Kavitha Suresh", table: "7" },
    { name: "Ong Jun Jie", table: "1" },
    { name: "Siti Nurhaliza", table: "5" },
    { name: "Wong Kah Wai", table: "10" }
  ];
  // --------------------------------------------------------

  const form = document.getElementById('searchForm');
  const input = document.getElementById('searchInput');
  const resultEl = document.getElementById('result');

  // Collapse extra whitespace and lowercase, so "  Tan   Wei Ming " matches "Tan Wei Ming"
  function normalize(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function lookup(query) {
    const q = normalize(query);

    if (!q) {
      resultEl.innerHTML = '<div class="hint">Enter your full name and press Find</div>';
      return;
    }

    // 1. Try exact match first.
    let match = GUESTS.find(g => normalize(g.name) === q);

    if (match) {
      showTable(match);
      return;
    }

    // 2. Fall back to partial match (handles missing middle name, name
    // order, minor typos) — but only reveal a result if it's unambiguous.
    // Never list other guests' names, even when there are multiple hits.
    const partial = GUESTS.filter(g => normalize(g.name).includes(q));

    if (partial.length === 1) {
      showTable(partial[0]);
      return;
    }

    if (partial.length > 1) {
      resultEl.innerHTML = '<div class="empty">A few names match that. Please type a bit more of your full name (e.g. add your last name) and press Find again.</div>';
      return;
    }

    resultEl.innerHTML = '<div class="empty">No match found. Please check the spelling matches your invite, or ask a staff member at the registration desk.</div>';
  }

  function showTable(g) {
    resultEl.innerHTML = `
      <div class="result-inner">
        <div class="result-name">${escapeHtml(g.name)}</div>
        <div class="result-table">${escapeHtml(g.table)}</div>
        <div class="result-label">Table</div>
      </div>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    lookup(input.value);
  });
</script>

</body>
</html>
