<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ILAD 2026 — Seating Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161a;
    --paper: #eeece6;
    --brass-bright: #c9a961;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--ink);
    background-image: url('bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding: 44px 36px;
    background: rgba(10,8,8,0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(201,169,97,0.25);
    border-radius: 3px;
  }

  .title-img {
    max-width: 100%;
    height: auto;
    margin-bottom: 18px;
  }

  .sub {
    font-size: 14px;
    color: rgba(238,236,230,0.55);
    margin-bottom: 24px;
  }

  .hint {
    font-size: 14px;
    color: rgba(238,236,230,0.4);
    margin-bottom: 6px;
  }

  .search-row {
    position: relative;
    margin-bottom: 16px;
  }

  input[type="text"] {
    width: 100%;
    padding: 16px 20px;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    background: rgba(238,236,230,0.06);
    border: 1px solid rgba(238,236,230,0.18);
    border-radius: 2px;
    color: var(--paper);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input[type="text"]::placeholder {
    color: rgba(238,236,230,0.35);
  }

  input[type="text"]:focus {
    border-color: var(--brass-bright);
    background: rgba(238,236,230,0.09);
  }

  input[type="text"]:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  button#findBtn {
    width: 100%;
    padding: 14px 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    background: var(--brass-bright);
    color: var(--ink);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.05s ease;
  }

  button#findBtn:hover {
    background: #dab975;
  }

  button#findBtn:active {
    transform: translateY(1px);
  }

  button#findBtn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }

  #result {
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 20px;
  }

  .result-inner {
    animation: rise 0.35s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-name {
    font-size: 13px;
    color: rgba(238,236,230,0.5);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .result-label {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(238,236,230,0.45);
    margin-bottom: 0px;
  }

  .result-table {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    line-height: 1.1;
    color: var(--brass-bright);
    font-weight: 600;
  }

  .empty {
    color: rgba(238,236,230,0.4);
    font-size: 14px;
  }

  @media (max-width: 480px) {
    .result-table { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="card">
  <img src="title.png" alt="International Lifeguard Appreciation Day — Dinner and Awards 2026" class="title-img">

  <div class="hint">Please enter your full name e.g., Tan Wei Ming, Jason</div>

  <form id="searchForm" autocomplete="off">
    <div class="search-row">
      <input
        type="text"
        id="searchInput"
        placeholder="Type your full name"
        autocomplete="off"
        autocapitalize="words"
      >
    </div>
    <button type="submit" id="findBtn">FIND MY TABLE</button>
  </form>

  <div id="result"></div>
</div>

<script>
  // Guest data is loaded from guests.csv (same folder as this file).
  // guests.csv format:
  //   name,table
  //   Tan Wei Ming,12
  //   Nur Aisyah Binte Rahman,4
  let GUESTS = [];
  let guestsLoaded = false;
  let guestsFailedToLoad = false;

  const form = document.getElementById('searchForm');
  const input = document.getElementById('searchInput');
  const resultEl = document.getElementById('result');
  const findBtn = document.getElementById('findBtn');

  function normalize(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Simple CSV line parser: handles basic quoted fields (e.g. "Tan, Wei Ming").
  function parseCsvLine(line) {
    const fields = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (inQuotes) {
        if (char === '"') {
          if (line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = false; }
        } else {
          current += char;
        }
      } else {
        if (char === '"') { inQuotes = true; }
        else if (char === ',') { fields.push(current); current = ''; }
        else { current += char; }
      }
    }
    fields.push(current);
    return fields.map(function (f) { return f.trim(); });
  }

  function parseCsv(text) {
    const lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
    if (lines.length === 0) return [];

    const header = parseCsvLine(lines[0]).map(function (h) { return h.toLowerCase(); });
    const nameIdx = header.indexOf('name');
    const tableIdx = header.indexOf('table');

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const fields = parseCsvLine(lines[i]);
      const name = fields[nameIdx];
      const table = fields[tableIdx];
      if (name && table) rows.push({ name: name, table: table });
    }
    return rows;
  }

  function loadGuests() {
    fetch('guests.csv')
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load guests.csv');
        return res.text();
      })
      .then(function (text) {
        GUESTS = parseCsv(text);
        guestsLoaded = true;
      })
      .catch(function () {
        guestsFailedToLoad = true;
      });
  }

  function showTable(g) {
    resultEl.innerHTML =
      '<div class="result-inner">' +
        '<div class="result-label">Table</div>' +
        '<div class="result-table">' + escapeHtml(g.table) + '</div>' +
      '</div>';
  }

  function lookup(query) {
    if (guestsFailedToLoad) {
      resultEl.innerHTML = '<div class="empty">Something went wrong loading the guest list. Please ask a staff member at the registration desk.</div>';
      return;
    }

    if (!guestsLoaded) {
      resultEl.innerHTML = '<div class="empty">Still loading the guest list, please try again in a moment.</div>';
      return;
    }

    const q = normalize(query);

    if (!q) {
      resultEl.innerHTML = '<div class="empty">Please type your full name first.</div>';
      return;
    }

    const exact = GUESTS.find(function (g) { return normalize(g.name) === q; });
    if (exact) {
      showTable(exact);
      return;
    }

    const partial = GUESTS.filter(function (g) { return normalize(g.name).indexOf(q) !== -1; });

    if (partial.length === 1) {
      showTable(partial[0]);
      return;
    }

    if (partial.length > 1) {
      resultEl.innerHTML = '<div class="empty">A few names match that. Please type a bit more of your full name and press Find my Table again.</div>';
      return;
    }

    resultEl.innerHTML = '<div class="empty">No match found. Please try again and key in your full name. If it still doesn\'t show up, please approach our staff at the registration counter for assistance.</div>';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    lookup(input.value);
  });

  loadGuests();
</script>

</body>

</html>
